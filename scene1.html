<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataland - Chapitre 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&family=Inter:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="phone.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050508;
            background-image: radial-gradient(circle at 50% 50%, #151520 0%, #050508 100%);
            font-family: 'Oxanium', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }
        :root {
            --bg-color: #050508;
            --phone-bg: #f7f9fc;
            --phone-width: 340px;
            --phone-height: 720px;
            --primary: #3b82f6;
            --text-dark: #1e293b;
            --border-radius: 40px;
        }
        .hidden { display: none !important; }

        /* Slideshow */
        #slideshow {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50;
            background: #050508;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }
        .slide {
            position: absolute;
            opacity: 0;
            transition: opacity 1s ease, transform 1.5s ease;
            transform: scale(0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .slide.active { opacity: 1; transform: scale(1); }

        /* Scene */
        #scene {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
        }

        /* Styles unifiés importés de phone.css */

        /* Animations */
        .flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            animation: flashAnim 1s forwards;
            z-index: 100;
        }
        @keyframes flashAnim {
            0% { opacity: 1; }
            100% { opacity: 0; display: none; }
        }

        .boot-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            background: #000;
            color: #fff;
        }
        .logo {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 4px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* UI Elements */
        .onboarding {
            padding: 60px 24px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            height: 100%;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            animation: fadeIn 0.5s forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .onboarding h1, .onboarding h2 { font-family: 'Oxanium', sans-serif; margin-bottom: 20px; color: #0f172a; }
        .onboarding p { font-size: 1rem; color: #475569; line-height: 1.5; margin-bottom: 20px; }
        .mt { margin-top: 20px; }
        
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s;
            background: #fff;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            width: 100%;
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.2);
        }
        .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-secondary {
            background: transparent;
            color: #64748b;
            border: none;
            padding: 12px 24px;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            margin-top: 10px;
            text-decoration: underline;
        }

        /* Fingerprint */
        .fingerprint-sensor {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            margin-top: 30px;
            background: rgba(59, 130, 246, 0.05);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .fingerprint-sensor.success {
            background: #10b981;
            border-color: #10b981;
            transform: scale(1.1);
        }
        .fingerprint-sensor.success svg {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .pulse-ring {
            width: 60px;
            height: 60px;
            background: rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            animation: sensorPulse 1.5s infinite;
        }
        @keyframes sensorPulse {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 30px;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--primary);
            transition: width 2s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        /* Home Screen */
        .home-screen {
            width: 100%;
            height: 100%;
            background: var(--phone-bg);
            transition: background 0.3s ease;
            padding: 40px 20px 20px;
            display: flex;
            flex-direction: column;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 30px;
            font-family: 'Inter', sans-serif;
            color: #334155;
            mix-blend-mode: multiply;
        }
        .apps-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px 12px;
        }
        .app-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: scale(0.8);
        }
        .app-wrapper.show {
            animation: appAppear 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes appAppear {
            to { opacity: 1; transform: scale(1); }
        }
        .app {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
            margin-bottom: 5px;
        }
        .app:active { transform: scale(0.9); }
        .app svg { width: 28px; height: 28px; fill: #fff; }
        .app-label {
            font-size: 0.65rem;
            font-family: 'Inter', sans-serif;
            color: #475569;
            text-align: center;
            font-weight: 500;
        }
        .bg-run { background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%); }
        .bg-basket { background: linear-gradient(135deg, #d35400 0%, #000000 100%); }
        .bg-music { background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%); }
        .bg-photos { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); }
        .bg-msg { background: #3b82f6; }
        .bg-maps { background: linear-gradient(135deg, #0ba360 0%, #3cba92 100%); }
        .bg-shop { background: #a855f7; }
        .bg-settings { background: #94a3b8; }
        
        .loading-text {
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
            font-family: 'Inter', sans-serif;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }
        @keyframes shake {
            0%, 100% { margin-left: 0; }
            25% { margin-left: -5px; }
            50% { margin-left: 5px; }
            75% { margin-left: -5px; }
        }
        .shake-anim {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes bounceBubble {
            0%, 100% { scale: 1; }
            50% { scale: 1.05; }
        }
        .bounce-anim {
            animation: bounceBubble 0.4s ease-in-out;
        }

        /* Notifications */
        .ios-notification {
            position: absolute;
            top: 45px;
            left: 50%;
            transform: translateX(-50%);
            width: 88%;
            background: rgba(30, 30, 30, 0.92);
            backdrop-filter: blur(20px);
            color: #fff;
            border-radius: 16px;
            padding: 12px 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            z-index: 80;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-family: 'Inter', sans-serif;
            animation: notifSlideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .ios-notification.slide-up {
            animation: notifSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .ios-notification-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .ios-notification-body {
            font-size: 0.8rem;
            color: #cbd5e1;
            line-height: 1.3;
        }
        @keyframes notifSlideDown {
            from { transform: translate(-50%, -120%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        @keyframes notifSlideUp {
            from { transform: translate(-50%, 0); opacity: 1; }
            to { transform: translate(-50%, -120%); opacity: 0; }
        }

        /* Modals */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            backdrop-filter: blur(4px);
            animation: fadeIn 0.3s forwards;
        }
        .modal {
            background: #fff;
            width: 85%;
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            font-family: 'Inter', sans-serif;
            max-height: 90%;
        }
        .modal p { color: #334155; line-height: 1.5; font-size: 0.95rem; margin-bottom: 20px; }
        .modal.full { width: 92%; height: 85%; padding: 20px 15px; }
        .modal h3 { font-size: 1rem; margin-bottom: 15px; color: #0f172a; }
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            text-align: left;
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 15px;
            padding-right: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
            background: #f8fafc;
        }
        .scroll-area p { margin-bottom: 12px; line-height: 1.5; }

        /* Messaging App */
        .app-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #fff;
            font-family: 'Inter', sans-serif;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: absolute;
            top:0; left:0; width:100%; z-index: 40;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .app-header {
            padding: 45px 20px 15px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 2;
        }
        .app-header .back { color: var(--primary); font-size: 0.9rem; cursor: pointer; font-weight: 500; }
        .app-header .title { font-weight: 600; font-size: 1.1rem; color: #0f172a; }
        .app-header .info { font-size: 0.8rem; color: #10b981; font-weight: 500; }
        .message-list {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f8fafc;
        }
        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: fadeIn 0.3s forwards;
            word-wrap: break-word;
        }
        .msg.sent {
            align-self: flex-end;
            background: var(--primary);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 5px rgba(59, 130, 246, 0.2);
        }
        .msg.received {
            align-self: flex-start;
            background: #e2e8f0;
            color: #1e293b;
            border-bottom-left-radius: 4px;
        }
        .msg.typing {
            align-self: flex-start;
            background: transparent;
            color: #94a3b8;
            font-style: italic;
            font-size: 0.85rem;
            padding: 5px;
        }
        .message-input-area {
            padding: 12px 15px 30px;
            background: #fff;
            border-top: 1px solid #f1f5f9;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .message-input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
        }
        .message-input-area button {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 40px; height: 40px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .message-input-area button:active { transform: scale(0.9); }
        .message-input-area button svg { fill: #fff; width: 18px; height: 18px; margin-left: 2px; }

        /* Widget */
        .widget-overlay {
            position: absolute;
            top: 45px; left: 0; width: 100%;
            display: flex;
            justify-content: center;
            z-index: 60;
            pointer-events: none;
            animation: slideDownWidget 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .widget-overlay.fade-out {
            animation: fadeOutWidget 0.4s ease forwards;
        }
        @keyframes slideDownWidget {
            from { transform: translateY(-120%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOutWidget {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(-20px); opacity: 0; }
        }
        .widget {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            width: 90%;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            border: 1px solid rgba(255,255,255,0.4);
        }
        .widget-header {
            padding: 12px 16px;
            background: rgba(248, 250, 252, 0.6);
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .widget-body { padding: 16px; }
        .widget-body p { margin: 0 0 8px 0; font-size: 0.95rem; color: #1e293b; line-height: 1.4; }
        .widget-body .route { color: var(--primary); font-weight: 600; font-size: 0.9rem; margin-bottom: 12px; }
        .btn-small { padding: 10px 16px; font-size: 0.85rem; border-radius: 10px; width: 100%; }
        .widget-buttons { display: flex; gap: 8px; margin-top: 10px; }
        .widget-buttons button { flex: 1; padding: 10px; font-size: 0.8rem; border-radius: 8px; cursor: pointer; border: none; font-family: 'Inter', sans-serif; transition: transform 0.2s; font-weight: 500;}
        .widget-buttons button:active { transform: scale(0.95); }
        .btn-walk { background: #f1f5f9; color: #334155; }
        .btn-uber { background: #000; color: #fff; }
        .destination { font-weight: 700; color: #e65100; }

        /* Controls (Thought bubble & colors) */
        #controls-container {
            position: absolute;
            left: 5%;
            top: 25%;
            width: 320px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        #thought-bubble {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px;
            border-radius: 24px 24px 24px 0;
            font-family: 'Inter', sans-serif;
            font-style: italic;
            font-size: 1.05rem;
            line-height: 1.5;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            color: #f8fafc;
            position: relative;
        }
        #thought-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 0;
            border-width: 15px 15px 0 0;
            border-style: solid;
            border-color: rgba(255, 255, 255, 0.05) transparent transparent transparent;
        }
        #thought-bubble.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .instruction {
            display: block;
            margin-top: 10px;
            font-size: 0.8rem;
            color: #94a3b8;
            font-style: normal;
            font-weight: 500;
        }

        #color-choices {
            display: flex;
            gap: 12px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        #color-choices.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .color-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            transition: all 0.2s;
            backdrop-filter: blur(8px);
            flex: 1;
        }
        .color-btn:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
        .color-btn:active { transform: translateY(0); }

        /* End Screen */
        .fade-to-black {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
            opacity: 0;
            transition: opacity 2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        .end-screen {
            text-align: center;
            color: #fff;
            font-family: 'Oxanium', sans-serif;
            transform: translateY(20px);
            opacity: 0;
            transition: all 1s ease;
        }
        .fade-to-black.active {
            opacity: 1;
            pointer-events: auto;
        }
        .fade-to-black.active .end-screen {
            transform: translateY(0);
            opacity: 1;
            transition-delay: 2s;
        }
        .end-screen h1 { font-size: 2.5rem; letter-spacing: 2px; margin-bottom: 40px; }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 900px) {
            #scene { flex-direction: column; }
            #controls-container {
                position: static;
                width: 100%;
                order: -1;
            }
            #thought-bubble {
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%) translateY(-20px);
                width: 90%;
                max-width: 360px;
                border-radius: 20px;
                z-index: 1000;
                margin: 0;
                text-align: center;
            }
            #thought-bubble.visible {
                transform: translateX(-50%) translateY(0);
            }
            #thought-bubble::after { display: none; }
            #color-choices {
                position: relative;
                justify-content: center;
                margin-top: 10px;
                margin-bottom: 20px;
            }
            #phone { transform: scale(0.9); }
        }
    </style>
</head>
<body>

    <!-- Diaporama d'introduction déporté dans v1.html -->

    <!-- Scène principale -->
    <div id="scene" class="hidden">
        
        <!-- Contrôles UI du joueur -->
        <div id="controls-container">
            <div id="thought-bubble" class="hidden">
                <div class="bubble-text"></div>
            </div>
            <div id="color-choices" class="hidden">
                <button class="color-btn" data-color="#ff4d4d">🔴 Rouge</button>
                <button class="color-btn" data-color="#10b981">🟢 Vert</button>
                <button class="color-btn" data-color="#3b82f6">🔵 Bleu</button>
            </div>
        </div>

        <!-- Téléphone -->
        <div id="phone-container" class="phone-container">
            <div id="phone" class="phone">
                <div class="notch"></div>
                <div id="screen" class="screen">
                    <!-- Contenu injecté dynamiquement -->
                </div>
            </div>
        </div>

    </div>

    <!-- Fade de fin -->
    <div class="fade-to-black" id="fade-end">
        <div class="end-screen">
            <h1>Fin de la Scène 1</h1>
            <button class="btn-outline" onclick="window.location.href='scene2.html'">Continuer →</button>
        </div>
    </div>

    <script>
        const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        
        const awaitClick = () => new Promise(resolve => {
            const handler = () => {
                document.removeEventListener('click', handler);
                resolve();
            };
            setTimeout(() => document.addEventListener('click', handler), 50);
        });

        const awaitElementClick = (id) => new Promise(resolve => {
            const el = document.getElementById(id);
            if(!el) return resolve();
            el.addEventListener('click', function handler() {
                el.removeEventListener('click', handler);
                resolve();
            });
        });

        function showSlide(num) {
            document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
            document.getElementById('slide-' + num).classList.add('active');
        }

        function showThought(htmlText) {
            return new Promise(resolve => {
                const bubble = document.getElementById('thought-bubble');
                bubble.querySelector('.bubble-text').innerHTML = htmlText;
                bubble.classList.remove('hidden');
                // Force reflow
                void bubble.offsetWidth;
                bubble.classList.add('visible');
                setTimeout(resolve, 500); 
            });
        }

        function hideThought() {
            return new Promise(resolve => {
                const bubble = document.getElementById('thought-bubble');
                bubble.classList.remove('visible');
                setTimeout(() => {
                    bubble.classList.add('hidden');
                    resolve();
                }, 400);
            });
        }

        function showColorChoice() {
            const choices = document.getElementById('color-choices');
            choices.classList.remove('hidden');
            void choices.offsetWidth;
            choices.classList.add('visible');
        }

        function hideColorChoice() {
            const choices = document.getElementById('color-choices');
            choices.classList.remove('visible');
            setTimeout(() => choices.classList.add('hidden'), 400);
        }

        function awaitColorChoice() {
            return new Promise(resolve => {
                const btns = document.querySelectorAll('.color-btn');
                const handler = (e) => {
                    btns.forEach(b => b.removeEventListener('click', handler));
                    resolve(e.target.dataset.color);
                };
                btns.forEach(b => b.addEventListener('click', handler));
            });
        }

            // --- ETAPE 2: Pensée initiale ---
